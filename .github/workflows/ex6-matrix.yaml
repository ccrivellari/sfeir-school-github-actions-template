name: npm test
on: 
  workflow_dispatch:

jobs:
  run-npm-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node-version: [20, 'lts/*']
        include:
          - os: ubuntu-latest
            node-version: 18

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: run install
        shell: bash
        run: |
          npm install
          npm test
